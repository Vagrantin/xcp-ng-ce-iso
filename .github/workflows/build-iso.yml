name: Build XCP-ng Home-laber Edition ISO
run-name: "Build XCP-ng Home-laber Edition ISO (Tag: ${{ github.ref_name }})"

# Dispatch-only: the iso-agent pushes the release tag, then dispatches this
# workflow on that tag ref with the exact component release tags to bake in.
# (A plain tag push no longer triggers a build — `releases/latest` raced with
# freshly published component releases and could bake a stale RPM.)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Emergency release (only needed when dispatching from a branch instead of a tag)'
        required: false
      xolite_tag:
        description: 'Exact xolite-ce release tag to bake in (empty = latest)'
        required: false
      xoa_proxy_tag:
        description: 'Exact xoa-proxy release tag to bake in (empty = latest)'
        required: false
      xcp_hl_release_tag:
        description: 'Exact xcp-hl-release release tag to bake in (empty = latest)'
        required: false

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180

    env:
      # Primary key fingerprint of "XCP-ng Community Edition". Published in the
      # release notes and asserted below, so the key shipped with an ISO can
      # never quietly become a different key from the one users are told to
      # expect. Subkeys rotate under this; the primary does not.
      GPG_FINGERPRINT: 2F591DB9D2C128C4C3D963F46DA00DCA5BBA215A

    steps:
      # ── 0. Checkout xcp-ng-ce-iso ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive versions from tag or input
        run: |
          # Dispatched on a tag ref (orchestrator path): ref_name is the tag.
          # Dispatched from a branch (emergency path): use the release_tag input.
          TAG="${{ github.ref_name }}"
          case "${TAG}" in
            v*-ce*) ;;
            *) TAG="${{ github.event.inputs.release_tag }}" ;;
          esac
          test -n "${TAG}" || { echo "Not running on a release tag and no release_tag input given"; exit 1; }
          # v8.3-ce3  →  XCPNG_VER=8.3  CE_COUNTER=ce3
          XCPNG_VER=$(echo "${TAG}" | sed 's/^v//;s/-ce.*//')
          CE_COUNTER=$(echo "${TAG}" | sed 's/.*-//')
          echo "XCPNG_VER=${XCPNG_VER}" >> $GITHUB_ENV
          echo "CE_COUNTER=${CE_COUNTER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${TAG}"      >> $GITHUB_ENV
          echo "▶ XCP-ng version: ${XCPNG_VER}, CE counter: ${CE_COUNTER}, full tag: ${TAG}"

      # ── 1. Import GPG key on the runner ───────────────────────────────────
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import passphrase-protected key
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" --import

          # Configure gpg-agent for non-TTY passphrase delivery
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          sleep 1

          # Pre-cache passphrase in agent for all subsequent signing
          echo "${GPG_PASSPHRASE}" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --quiet --no-tty \
            -u "XCP-ng Community Edition" \
            --sign --output /dev/null /dev/null

          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons 2>/dev/null \
            | awk -F: '/^sec/{print $5}' | head -1)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV
          echo "GPG_PASSPHRASE=${GPG_PASSPHRASE}" >> $GITHUB_ENV
          echo "▶ GPG key imported: ${GPG_KEY_ID}"

          # The release notes tell users to expect GPG_FINGERPRINT, and the
          # release now ships this key as a file. If the secret ever holds a
          # different key, publishing it under those instructions would be
          # worse than not publishing it at all, so fail here instead.
          ACTUAL_FPR=$(gpg --list-secret-keys --with-colons --fingerprint 2>/dev/null \
            | awk -F: '/^fpr/{print $10; exit}')
          if [ "${ACTUAL_FPR}" != "${GPG_FINGERPRINT}" ]; then
            echo "❌ signing key is ${ACTUAL_FPR}, expected ${GPG_FINGERPRINT}"
            exit 1
          fi
          echo "▶ GPG fingerprint verified: ${ACTUAL_FPR}"

      # ── 2. Clone the official ISO build toolchain ─────────────────────────
      - name: Clone create-install-image
        run: |
          git clone -b master https://github.com/xcp-ng/create-install-image.git
          echo "▶ Toolchain cloned (master branch)"
          ls create-install-image/scripts/

      # ── 4. Fetch the signed community xo-lite-ce RPM ──────────────────────
      - name: Fetch community xo-lite RPM
        run: |
          # Pinned tag from the orchestrator = deterministic build. Fall back
          # to releases/latest only for manual emergency runs without the input.
          PINNED_TAG="${{ github.event.inputs.xolite_tag }}"
          if [ -n "${PINNED_TAG}" ]; then
            RELEASE_API="https://api.github.com/repos/${{ github.repository_owner }}/xolite-ce/releases/tags/${PINNED_TAG}"
            echo "▶ Using pinned xolite-ce release: ${PINNED_TAG}"
          else
            RELEASE_API="https://api.github.com/repos/${{ github.repository_owner }}/xolite-ce/releases/latest"
            echo "▶ No xolite_tag input — falling back to latest xolite-ce release"
          fi

          RPM_URL=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${RELEASE_API}" \
            | jq -r '.assets[] | select(.name | endswith(".rpm")) | .browser_download_url')

          test -n "${RPM_URL}" || { echo "Failed to find RPM asset for ${RELEASE_API}"; exit 1; }
          echo "▶ Downloading: ${RPM_URL}"

          # Extract the actual filename dynamically (e.g. xo-lite-ce-0.8.0-1.noarch.rpm)
          PACKAGE_NAME=$(basename "${RPM_URL}")
          echo "XOLITE-CE_FILENAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "▶ Detected filename: ${PACKAGE_NAME}"

          wget -q -O "${PACKAGE_NAME}" "${RPM_URL}"

      # ── 4b. Fetch the signed community xoa-proxy RPM ──────────────────────
      - name: Fetch xoa-proxy RPM
        run: |
          PINNED_TAG="${{ github.event.inputs.xoa_proxy_tag }}"
          if [ -n "${PINNED_TAG}" ]; then
            RELEASE_API="https://api.github.com/repos/Vagrantin/xoa-proxy/releases/tags/${PINNED_TAG}"
            echo "▶ Using pinned xoa-proxy release: ${PINNED_TAG}"
          else
            RELEASE_API="https://api.github.com/repos/Vagrantin/xoa-proxy/releases/latest"
            echo "▶ No xoa_proxy_tag input — falling back to latest xoa-proxy release"
          fi

          RPM_URL=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${RELEASE_API}" \
            | jq -r '.assets[] | select(.name | endswith(".rpm")) | .browser_download_url')

          test -n "${RPM_URL}" || { echo "Failed to find xoa-proxy RPM asset for ${RELEASE_API}"; exit 1; }
          echo "▶ Downloading: ${RPM_URL}"

          PACKAGE_NAME=$(basename "${RPM_URL}")
          echo "XOA_PROXY_FILENAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "▶ Detected filename: ${PACKAGE_NAME}"

          wget -q -O "${PACKAGE_NAME}" "${RPM_URL}"

      # ── 4c. Fetch the signed xcp-hl-release RPM ───────────────────────────
      # Carries /etc/yum.repos.d/xcp-hl.repo and the community signing key, so a
      # host installed from this ISO can reach the XCP-HL yum repositories (and
      # therefore show XCP-HL updates in XOA) without any manual setup.
      - name: Fetch xcp-hl-release RPM
        run: |
          PINNED_TAG="${{ github.event.inputs.xcp_hl_release_tag }}"
          if [ -n "${PINNED_TAG}" ]; then
            RELEASE_API="https://api.github.com/repos/Vagrantin/xcp-hl/releases/tags/${PINNED_TAG}"
            echo "▶ Using pinned xcp-hl-release release: ${PINNED_TAG}"
          else
            RELEASE_API="https://api.github.com/repos/Vagrantin/xcp-hl/releases/latest"
            echo "▶ No xcp_hl_release_tag input, falling back to latest xcp-hl release"
          fi

          # Name-matched rather than suffix-matched so a second package appearing
          # in xcp-hl later cannot return two URLs and break basename/wget below.
          RPM_URL=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${RELEASE_API}" \
            | jq -r '.assets[] | select(.name | startswith("xcp-hl-release-")) | select(.name | endswith(".rpm")) | .browser_download_url')

          test -n "${RPM_URL}" || { echo "No xcp-hl-release RPM on ${RELEASE_API}; the Build and Sign XCP-HL Release RPM workflow must publish one first"; exit 1; }
          echo "▶ Downloading: ${RPM_URL}"

          PACKAGE_NAME=$(basename "${RPM_URL}")
          echo "XCP_HL_RELEASE_FILENAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "▶ Detected filename: ${PACKAGE_NAME}"

          wget -q -O "${PACKAGE_NAME}" "${RPM_URL}"

      # ── 5. Build local community RPM repo ─────────────────────────────────
      - name: Create and Sign community RPM repo
        run: |
          sudo apt-get install -y createrepo-c -qq
          mkdir -p community-repo/x86_64
          cp "${{ env.XOLITE-CE_FILENAME }}" community-repo/x86_64/
          cp "${{ env.XOA_PROXY_FILENAME }}" community-repo/x86_64/
          cp "${{ env.XCP_HL_RELEASE_FILENAME }}" community-repo/x86_64/
          createrepo_c community-repo/x86_64
          # Sign the metadata of the community repo (agent has cached passphrase)
          gpg --batch --pinentry-mode loopback \
            --detach-sign --armor \
            community-repo/x86_64/repodata/repomd.xml

      # ── 6. Pull the official build environment ────────────────────────────
      - name: Pull xcp-ng-build-env
        run: |
          docker pull ghcr.io/xcp-ng/xcp-ng-build-env:${XCPNG_VER}

      # ── 7. Export GPG private key for container ───────────────────────────
      - name: Export GPG key for container
        run: |
          # Export private key — passphrase required to decrypt key material for export
          gpg --batch --armor --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --export-secret-keys "${GPG_KEY_ID}" > /tmp/community-signing.key
          gpg --armor --export "${GPG_KEY_ID}" > /tmp/RPM-GPG-KEY-xcp-ng-ce
          chmod 600 /tmp/community-signing.key

      # ── 8. Build ISO inside the container ─────────────────────────────────
      - name: Build toolchain image with dependencies
        run: |
          cat > Dockerfile.build <<EOF
          FROM ghcr.io/xcp-ng/xcp-ng-build-env:${XCPNG_VER}
          RUN yum install -y -q \
                genisoimage syslinux grub-tools createrepo_c libfaketime patch && \
              yum install -y -q --enablerepo=epel gnupg1 && \
              curl -sL https://xcp-ng.org/RPM-GPG-KEY-xcpng \
              -o /etc/pki/rpm-gpg/RPM-GPG-KEY-xcpng
          EOF
          docker build -f Dockerfile.build -t xcp-ng-build-local .
      
      - name: Bake GPG key into image
        run: |
          # gpg1 (classic GnuPG) requires passphrase via --passphrase flag
          CONTAINER_ID=$(docker run -d \
            --user root \
            -e "GPG_PASSPHRASE=${GPG_PASSPHRASE}" \
            -v "/tmp/community-signing.key:/community-signing.key:ro" \
            xcp-ng-build-local \
            bash -c 'gpg1 --batch --passphrase "${GPG_PASSPHRASE}" \
              --import /community-signing.key')
          docker wait "${CONTAINER_ID}"
          docker commit "${CONTAINER_ID}" xcp-ng-build-ready
          docker rm "${CONTAINER_ID}"

      - name: Prepare create-install-image for custom repo
        run: |
          # Ensure the destination directory exists for the specific version
          mkdir -p create-install-image/configs/${XCPNG_VER}
          
          # Copy customized template into the toolchain's version-specific config dir
          cp create-install-image/configs/base/* create-install-image/configs/${XCPNG_VER}/
          cp -f configs/repo/CUSTOMREPO.tmpl create-install-image/configs/${XCPNG_VER}/CUSTOMREPO.tmpl
          
          # Use the dynamic filename to discover the internal package name (e.g. xo-lite-ce)
          PKG_NAME=$(rpm -qp "${{ env.XOLITE-CE_FILENAME }}" --qf '%{NAME}')
          echo "Discovered internal package name: ${PKG_NAME}"
          sed -i "s/^xo-lite\$/${PKG_NAME}/" create-install-image/configs/${XCPNG_VER}/packages.lst

          echo "▶ Custom repo template deployed for XCP-ng ${XCPNG_VER}"

      - name: Inject Community GPG key into toolchain templates
        run: |
          mkdir -p create-install-image/templates/installimg/base/etc/pki/rpm-gpg/
          cp /tmp/RPM-GPG-KEY-xcp-ng-ce create-install-image/templates/installimg/base/etc/pki/rpm-gpg/
          curl -sL https://xcp-ng.org/RPM-GPG-KEY-xcpng -o create-install-image/templates/installimg/base/etc/pki/rpm-gpg/RPM-GPG-KEY-xcpng

      # host-installer reads [build] number from the media's .treeinfo and
      # writes it to BUILD_NUMBER in /etc/xensource-inventory, so stamping the
      # ce counter here is what lets an installed host name the ISO it came
      # from. Upstream ships the placeholder "cloud". create-iso.sh copies this
      # template into the ISO and only substitutes @@...@@ tokens, so the value
      # set here reaches the media untouched.
      - name: Stamp ISO build number into .treeinfo
        run: |
          set -euo pipefail
          TREEINFO="create-install-image/templates/iso/${XCPNG_VER}/.treeinfo"
          # Fail loudly rather than ship an unstamped ISO if upstream restructures.
          grep -q '^number = ' "${TREEINFO}" || {
            echo "❌ no '[build] number' line in ${TREEINFO}; upstream layout changed"
            exit 1
          }
          sed -i "s/^number = .*/number = ${CE_COUNTER}/" "${TREEINFO}"
          grep -qx "number = ${CE_COUNTER}" "${TREEINFO}" || {
            echo "❌ failed to stamp build number into ${TREEINFO}"
            exit 1
          }
          echo "▶ ISO build number stamped: ${CE_COUNTER}"

      - name: Patch toolchain with git
        run: |
          cd create-install-image
          git apply ../patches/multi-key-support.patch
          git apply ../patches/installer-iso-sr-hook.patch

          if grep -q "allmatches" scripts/create-installimg.sh; then
            echo "Toolchain patched successfully"
          else
            echo "Patch verification failed"
            exit 1
          fi

          if grep -q "host-installer-iso-sr.patch" scripts/create-installimg.sh; then
            echo "XCP-HL ISO-SR hook patched successfully"
          else
            echo "XCP-HL ISO-SR hook patch verification failed"
            exit 1
          fi

          # host-installer-iso-sr.patch is applied by create-installimg.sh
          # itself (see the hook above), inside the container, against
          # $ROOTFS/opt/xensource/installer -- so it has to be visible at
          # $topdir/host-installer-iso-sr.patch, i.e. alongside scripts/, not
          # just present on the runner.
          cp ../patches/host-installer-iso-sr.patch .

      - name: Build install.img
        run: |
          docker run --rm \
            --user root -w /tmp \
            -v "$(pwd)/create-install-image:/create-install-image:ro" \
            -v "/tmp/RPM-GPG-KEY-xcp-ng-ce:/etc/pki/rpm-gpg/RPM-GPG-KEY-xcp-ng-ce" \
            -v "$(pwd)/community-repo:/community-repo:ro" \
            -v "$(pwd):/output" \
            xcp-ng-build-ready \
            bash -ce "
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-xcpng 
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-xcp-ng-ce 
              echo '--- Local Repo Contents ---'
              ls -lR /community-repo

              /create-install-image/scripts/create-installimg.sh \
                --output /output/install-${XCPNG_VER}.img \
                --define-repo community!file:///community-repo \
                --define-repo base!https://updates.xcp-ng.org/8/${XCPNG_VER}/base \
                --define-repo updates!https://updates.xcp-ng.org/8/${XCPNG_VER}/updates \
                --verbose \
                ${XCPNG_VER}
            echo 'install.img built'
            "

      - name: Build ISO
        run: |
          OUTPUT="xcp-ng-${XCPNG_VER}-${CE_COUNTER}.iso"
          VOLID="XCP-ng CE ${XCPNG_VER} (${CE_COUNTER})"

          sudo chown -R 1000:1000 .

          docker run --rm \
            --user builder \
            -w /home/builder \
            -e GPG_KEY_ID="${GPG_KEY_ID}" \
            -v "$(pwd)/create-install-image:/create-install-image:ro" \
            -v "$(pwd)/community-repo:/community-repo:ro" \
            -v "$(pwd):/output" \
            xcp-ng-build-ready \
            bash -c "
              /create-install-image/scripts/create-iso.sh \
                -V \"${VOLID}\" \
                --output /output/${OUTPUT} \
                --force-overwrite \
                --define-repo community!file:///community-repo \
                --define-repo base!https://updates.xcp-ng.org/8/${XCPNG_VER}/base \
                --define-repo updates!https://updates.xcp-ng.org/8/${XCPNG_VER}/updates \
                --verbose \
                ${XCPNG_VER} /output/install-${XCPNG_VER}.img
            "
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV
          
      - name: Restore working directory ownership
        run: sudo chown -R $(id -u):$(id -g) .

      # ── 9. Verification & Cleanup ─────────────────────────────────────────
      - name: Remove GPG private key
        if: always()
        run: shred -u /tmp/community-signing.key || true

      - name: Verify community RPM in ISO
        run: |
          sudo apt-get install -y xorriso -qq
          mkdir -p /tmp/iso-check
          xorriso -osirrox on -indev "${OUTPUT}" -extract /Packages /tmp/iso-check/
          echo "▶ Contents of ISO Packages directory:"
          ls -l /tmp/iso-check
          
          # Verify based on the new 'xo-lite-ce' naming pattern
          find /tmp/iso-check -name "xo-lite-ce*.rpm" | grep -q "xo-lite-ce" || {
            echo "Verification failed: New xo-lite-ce RPM not found in ISO"
            exit 1
          }

          # xcp-hl-release reaches the media, and installed hosts, solely as a
          # dependency of xo-lite-ce, the route xoa-proxy already takes. That
          # is the only mechanism now, so assert it: if the Requires: is ever
          # dropped, or an xolite-ce release predating it is pinned, the ISO
          # silently ships without XCP-HL repo configuration.
          find /tmp/iso-check -name "xcp-hl-release*.rpm" | grep -q "xcp-hl-release" || {
            echo "Verification failed: xcp-hl-release RPM not found in ISO"
            echo "Hosts installed from this ISO would have no XCP-HL yum repos."
            exit 1
          }

          # The stamped build number is what an installed host reports as
          # BUILD_NUMBER, so assert it survived into the media.
          xorriso -osirrox on -indev "${OUTPUT}" -extract /.treeinfo /tmp/iso-treeinfo
          grep -qx "number = ${CE_COUNTER}" /tmp/iso-treeinfo || {
            echo "Verification failed: .treeinfo build number is not ${CE_COUNTER}"
            grep -A1 "^\[build\]" /tmp/iso-treeinfo || true
            exit 1
          }
          echo "▶ ISO .treeinfo build number: ${CE_COUNTER}"
          echo "Verification successful"

      # host-installer-iso-sr.patch touches install.img (the installer's own
      # ramdisk), not a package in the ISO's own repo, so it needs its own
      # check: unpack the ramdisk and confirm the patched backend.py landed,
      # rather than trusting the "Patch toolchain with git" step's grep alone
      # (that only proves the hook line exists in the toolchain script, not
      # that create-installimg.sh actually ran it against a real $ROOTFS).
      - name: Verify XCP-HL ISO-SR patch in install.img
        run: |
          # No pipefail on purpose: grep -q closes the pipe early, which
          # SIGPIPEs bzip2/cpio upstream and would fail the step on success.
          set -eu
          command -v cpio >/dev/null || { echo "cpio not available on the runner"; exit 1; }

          # create-installimg.sh packs the ramdisk with "find . | cpio -o",
          # and GNU cpio normalises the leading "./" away, so members are
          # stored as "opt/..." not "./opt/...". Match with a glob so this
          # holds either way.
          bzip2 -dc "install-${XCPNG_VER}.img" \
            | cpio -i --to-stdout "*opt/xensource/installer/backend.py" \
            > /tmp/patched-backend.py 2>/dev/null

          test -s /tmp/patched-backend.py || {
            echo "Verification failed: could not extract backend.py from install.img"
            echo "Members under opt/xensource/installer:"
            bzip2 -dc "install-${XCPNG_VER}.img" | cpio -it 2>/dev/null \
              | grep "opt/xensource/installer" | head -20
            exit 1
          }

          grep -q "installIsoSrFirstboot" /tmp/patched-backend.py || {
            echo "Verification failed: install.img's backend.py has no XCP-HL ISO-SR code"
            exit 1
          }

          # The first-boot script and unit are new files created by the patch,
          # so finding them proves the whole patch applied, not just the hunks
          # against existing files.
          bzip2 -dc "install-${XCPNG_VER}.img" | cpio -it 2>/dev/null \
            | grep -q "opt/xensource/installer/xcp-hl/xcp-hl-iso-sr-init" || {
            echo "Verification failed: first-boot script missing from install.img"
            exit 1
          }

          echo "▶ install.img carries the XCP-HL ISO-SR patch"

      # ── 10. Checksum and sign ─────────────────────────────────────────────
      - name: Generate and sign SHA256SUMS
        run: |
          CHECKSUM_FILE="${OUTPUT}.sha256"
          sha256sum "${OUTPUT}" > "${CHECKSUM_FILE}"
          echo "CHECKSUM_FILE=${CHECKSUM_FILE}" >> $GITHUB_ENV
          echo "▶ Checksum:"
          cat "${CHECKSUM_FILE}"

          gpg --batch --pinentry-mode loopback \
            --detach-sign --armor \
            "${CHECKSUM_FILE}"
          # produces ${OUTPUT}.sha256.asc

          echo "▶ Verifying signature before publish:"
          gpg --verify "${CHECKSUM_FILE}.asc" "${CHECKSUM_FILE}"

      # The key that verifies the release, published with the release. This is
      # exported from the runner's keyring rather than committed, so it is by
      # construction the key that just signed the checksum file.
      - name: Export the public signing key for publication
        run: |
          set -euo pipefail
          PUBKEY_FILE="xcp-ng-ce-public.asc"
          gpg --armor --export "${GPG_KEY_ID}" > "${PUBKEY_FILE}"
          test -s "${PUBKEY_FILE}" || { echo "❌ exported key is empty"; exit 1; }
          echo "PUBKEY_FILE=${PUBKEY_FILE}" >> $GITHUB_ENV

          # Prove the published file verifies the published signature, using a
          # throwaway keyring so the runner's own keys cannot mask a bad export.
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --import "${PUBKEY_FILE}"
          gpg --batch --verify "${CHECKSUM_FILE}.asc" "${CHECKSUM_FILE}"
          echo "▶ published key verifies the published signature"

      # ── 11. Publish Release ───────────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## XCP-ng Community Edition ISO
            Unofficial community build of XCP-ng ${{ env.XCPNG_VER }} (${{ env.CE_COUNTER }}).

            ### Release files

            | File | Purpose |
            |---|---|
            | `xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso` | Bootable installer ISO |
            | `xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso.sha256` | SHA256 checksum of the ISO |
            | `xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso.sha256.asc` | GPG signature over the checksum file |
            | `xcp-ng-ce-public.asc` | The public key that signature was made with |

            ### Verify before installing

            Verification works in two steps: first you confirm the checksum file
            was signed by this project, then you confirm the ISO matches that checksum.
            Both steps are required.

            **1. Download the files into the same directory**

            All files must be in the same directory — `sha256sum -c` looks for
            the ISO by name in the current directory.

            ```bash
            cd ~/Downloads
            # download the files listed above from this release page
            ```

            **2. Import the community GPG key (one-time)**

            From a keyserver, which is the stronger option because it is a
            channel independent of this release page:

            ```bash
            gpg --keyserver keys.openpgp.org \
                --recv-keys ${{ env.GPG_FINGERPRINT }}
            ```

            If the keyserver is unreachable, or you are verifying offline, use
            `xcp-ng-ce-public.asc` from this release instead:

            ```bash
            gpg --import xcp-ng-ce-public.asc
            ```

            Then check that the key you imported is the one you expect:

            ```bash
            gpg --fingerprint ${{ env.GPG_FINGERPRINT }}
            ```

            Be aware of what each route proves. A key taken from this release
            page is only as trustworthy as the page it came from: anyone able
            to replace the ISO could replace the key beside it, and the
            signature would still check out. It gives you a working offline
            verification and a guarantee that the ISO, the checksum and the
            key all came from one build — not proof of who built it. For that,
            compare the fingerprint above against a source that is not this
            page: the keyserver, or the copy published at
            https://vagrantin.github.io/xcp-hl/xcp-ng-ce-public.asc

            **3. Verify the checksum file is authentic**

            This confirms the checksum file was produced by this project and has
            not been tampered with.

            ```bash
            gpg --verify xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso.sha256.asc \
                         xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso.sha256
            ```

            Expected output:
            ```
            gpg: Good signature from "XCP-ng Community Edition <xcp-ng-ce.lid530@passmail.com>"
            ```

            If you see `BAD signature` — stop. The checksum file has been tampered with.

            **4. Verify the ISO matches the signed checksum**

            This confirms the ISO file is intact and matches what was released.

            ```bash
            sha256sum -c xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso.sha256
            ```

            Expected output:
            ```
            xcp-ng-${{ env.XCPNG_VER }}-${{ env.CE_COUNTER }}.iso: OK
            ```

            If you see `FAILED` — the ISO is corrupted. Delete it and re-download.

